name: Automation Framework

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    env:
      QA_BDNO_TOKEN: ${{ secrets.QA_BDNO_TOKEN }}
      QA_CRT_TOKEN: ${{ secrets.QA_CRT_TOKEN }}

      PROD_BDNO_TOKEN: ${{ secrets.PROD_BDNO_TOKEN }}
      PROD_CRT_TOKEN: ${{ secrets.PROD_CRT_TOKEN }}


    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Run Smoke Suite
        run: |
          mvn clean test \
          -Denv=QA \
          -DsuiteXmlFile=testng/testng-smoke.xml